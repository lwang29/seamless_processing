# The pipeline runs inside the existing ViBES environment on this cluster:
#   /simurgh/group/lw29/conda/envs/ViBES/bin/python
# That environment is not modified. This file exists so the dependency set is
# reproducible elsewhere; ffmpeg must be on PATH for the review artefacts.
name: seamless-curation
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.26,<3
  - pandas>=2.2
  - pyarrow>=15
  - pyyaml>=6
  - soundfile>=0.12
  - opencv>=4.8
  - ffmpeg
  - pytest>=8
  - pip
  - pip:
      # Needed only by `render` when it produces the 30-second review clip.
      - smplx>=0.1.28
