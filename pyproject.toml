[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seamless-curation"
version = "2.0.0"
description = "Comprehensive, level-separated annotation of every recording and clip of the Seamless Interaction dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "pyarrow>=15",
  "PyYAML>=6",
  "opencv-python>=4.8",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Only the FK equivalence test needs these (it checks the NumPy forward kinematics
# against smplx); every stage runs the forward kinematics in NumPy.
smplx = ["smplx>=0.1.28", "torch>=2.0"]
# The optional pixel pass (scan-video) decodes keyframes with PyAV.
video = ["av>=12"]
test = ["pytest>=8"]

[project.scripts]
seamless-curation = "seamless_curation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The repo root is on the path so `tests.conftest` imports as a package; `src`
# so the package imports without an install.
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]
