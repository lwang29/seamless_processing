[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seamless-curation"
version = "1.0.0"
description = "Manually verified co-speech upper-body subset of the Seamless Interaction dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "pyarrow>=15",
  "PyYAML>=6",
  "opencv-python>=4.8",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Only the 30-second review clip needs these: it renders the SMPL-H reprojection
# through smplx. Every other stage — including the scan and the review card —
# runs the forward kinematics in NumPy against the neutral model directly.
clip = ["smplx>=0.1.28", "torch>=2.0"]
test = ["pytest>=8"]

[project.scripts]
seamless-curation = "seamless_curation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The repo root is on the path so `tests.conftest` imports as a package; `src`
# so the package imports without an install.
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]
