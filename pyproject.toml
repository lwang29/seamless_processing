[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seamless-curation"
version = "0.1.0"
description = "Restartable measurement harness for Seamless Interaction curation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pyarrow>=15",
  "PyYAML>=6",
  "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
seamless-curation-extract = "seamless_curation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
