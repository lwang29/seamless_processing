schema_version: 2
run_id: vibes_upper_body_v1

# What this run is for
# --------------------
# Build a manually verified subset of the Seamless Interaction dataset for an
# initial ViBES upper-body training experiment: torso, shoulders, arms, wrists,
# hands, neck and head only. Lower-body quality, seated posture and legs outside
# the frame are explicitly not reasons to reject. The accepted set is defined by
# a manifest; the source tree is never written to.
#
# Every threshold below is a decision. The reason each one sits where it does is
# in the docstring of the module that reads it (src/seamless_curation/gates.py)
# and the evidence is in reports/17_cospeech_gesture.md.

source_root: ./seamless_interaction
model_root: ./model_files
inventory: ./outputs/02_inventory/summary/inventory_joined.parquet

# All four vendors. The v0 pipeline settled on V00 alone, largely on grounds
# that no longer apply: FM1 (seated posture) rejected a quarter of V03 and is
# retired, and global orientation — which is what the quarter-turned V03 rasters
# get wrong — does not enter root-relative upper-body pose at all. The rasters
# that genuinely cannot be used are excluded by corpus.EXCLUDED_RASTERS.
vendors: [V00, V01, V02, V03]

outputs:
  root: ./outputs/vibes_upper_body_v1
  private_root: ./artifacts/vibes_upper_body_v1

scan:
  # 30 s is long enough to see whether a gesture pattern holds and short enough
  # that a reviewer can watch it. The hop makes neighbouring windows overlap, so
  # a gesture-dense stretch is found wherever it starts; selection then vetoes
  # overlap when it picks clips.
  window_seconds: 30.0
  hop_seconds: 10.0
  tasks: 512
  gesture: {}

# Tier-1 eligibility gates. Deliberately permissive: they run over 2.4 M windows
# before selection and cannot tell "modest gesturer" from "no gesturer" without
# deleting the modest one. Empty = the documented defaults in gates.py.
gates: {}

# Tier-2 qualification: the production accept/reject decision, which replaced
# manual review. Nine disqualifiers naming pathologies, plus a composite quality
# score that lets strength on several dimensions compensate for modesty on one.
# Calibrated against labelled review data; see reports/18_automated_qualification.md
# and docs/pipeline.md section 6. These are the numbers to move when the filter
# is letting the wrong things through, or keeping too little.
qualify:
  # --- disqualifiers: failing any one is fatal, nothing compensates ---
  min_speech_seconds: 8.0          # not enough speech to judge co-speech gesture
  min_gesture_frac_speech: 0.50    # hands static while speaking  (exclusion 1)
  min_wrist_height_p75_mm: -260.0  # hands parked in lap/at sides (exclusion 1)
  min_episodes_speech: 3           # a single movement            (exclusion 5)
  min_episode_median_s: 0.55       # a string of twitches         (exclusion 5)
  min_speech_segments_covered: 0.60  # not sustained across utterances (exclusion 5)
  min_articulation_ratio: 2.5      # motion is whole-body         (exclusion 4)
  min_step_cosine_p50: 0.25        # tracker noise, by direction  (exclusion 3)
  min_consistency_r: 0.70          # the two channels disagree    (exclusion 3)
  # --- composite: weighted mean of posture/persistence/vigour/integrity ---
  # 0.34 is the LEFT EDGE OF A PLATEAU, chosen by a stated rule rather than fitted:
  # on the representative labelled sample, precision (0.936), recall (0.912) and
  # specificity (0.615) are identical for every threshold in 0.34-0.40, so 0.34 is
  # the smallest value delivering the full quality gain and therefore the one that
  # keeps the most data and the highest recall. See reports/18 section 4.
  min_gesture_quality: 0.34

select:
  # The review unit is the file; its card samples the frames that would be
  # accepted and its verdict applies to all of its clips. Eight 30-second clips
  # is above the 90th percentile of what a file actually yields, so this is a
  # guard against one very long recording dominating, not a routine cut.
  max_clips_per_file: 8
  # One V00 participant appears in 221 files. An unbalanced training set is a
  # worse training set even when every clip in it is good.
  max_files_per_participant: 12
  seed: vibes-v1

render:
  clip_seconds: 30.0
  tasks: 256
