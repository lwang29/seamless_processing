schema_version: 2
session: 2
review_round: 5
variant: pi_briefing
purpose: >
  A fresh, independent V00 sample for the PI briefing gallery. Same three
  detectors and same thresholds as the working scan; only the sampling seed
  differs, so the flag rates quoted in that gallery are measured on the very
  clips it shows rather than carried over from the tuning sample.

source_root: ./seamless_interaction
inventory: outputs/02_inventory/summary/inventory_joined.parquet

task_count: 64

sampling:
  # A new seed. The tuning sample (seed 20260814) is where FM1's thresholds were
  # chosen against hand labels, so quoting rates from it would be quoting them on
  # the data they were fitted to. This draw is independent of that.
  per_label: 2000
  seed: 20260907

smplh:
  model_root: ./model_files
  flat_hand_mean: true

measurement:
  batch_size: 256
  # Longest recordings are truncated so one 76-minute outlier cannot stall a
  # task. Any truncation is recorded per file.
  max_frames: 36000
  # FM2: a point this far outside the raster still counts as inside. Zero is the
  # literal rule the reviewer asked for.
  in_frame_margin_px: 0.0
  # FM2: test every mesh vertex. A stride of 8 gave an identical file-level flag
  # rate on 180 files; stride 1 is kept because the whole vertex rule costs only
  # 14.9% of detector throughput and the reviewer asked for "any part of the
  # participant's body".
  vertex_stride: 1
  # FM2: superseded by the vertex test, kept as a knob. A positive value would
  # demand that joint centres sit this far inside the raster.
  smplh_joint_inset_px: 0.0
  # FM2: 1 is the literal reading, a single violating frame flags the file.
  # 2 would drop the one-frame, 0.2 px case measured in the 180-file sample.
  min_violation_run_frames: 1
  # FM2 comparison only: how much of the same file a windowed rule would keep,
  # at the new 30-second clip length.
  window_s: 30.0
  # FM3: "the same position" means within this many shoulder widths of the
  # wrist's own per-file median position. The reviewer reviewed this calibration
  # in Round 3 and asked for it to be left alone.
  static_radius_shoulder_widths: 0.10
  # Evaluated in the same pass so the radius can be re-tuned from the report.
  static_extra_radii: [0.05, 0.15, 0.20, 0.30]

# Applied by scripts/v00_fm_analyze.py, never during measurement.
thresholds:
  # FM1. Two rounds of reviewer inspection have cut this to one measure plus one
  # rare-posture add-on, on 66 hand-labelled files (19 sitting / 47 standing).
  #
  # Retired in Round 4 -- the 2D leg ratios. leg_over_torso < 0.85 scored 0/15
  # and knee_spread > 0.90 missed all four sitters it was not selected on; both
  # encode body proportion, not posture, because all sixteen SMPL-H betas are
  # zero so FK limbs are identical across files while 2D limbs are not.
  #
  # Retired in Round 5 -- hip flexion. Every one of the four labelled files it
  # flags that knee_between does not is a STANDING person, and it costs 29 extra
  # files corpus-wide with no validated hit among them. Still measured, no
  # longer decides.
  #
  # knee_between_torso sits on a plateau: any cut in 0.41-0.44 gives 18/19
  # sitting and 46/47 standing. 0.43 is the midpoint.
  sitting_knee_between_torso: 0.43
  # A sign change, not a magnitude: the ankle above the knee, feet on a stool
  # rung. Fires on one file in 4,000 and the reviewer confirmed it is seated.
  sitting_shin_verticality: 0.0
  # Unit level. The reviewer observed that a participant either stands in all of
  # their recordings or sits in all of them. Measurement puts the scope of that
  # at the recording SESSION, not the person: P0003A appears in 8 sessions,
  # seated in one (hip flexion 88.2) and standing in the other seven (130.6 to
  # 156.1). Corpus-wide the median within-session spread of hip flexion is 2.76
  # deg against 7.11 deg between sessions, and internally-disagreeing units fall
  # from 6.81% to 2.52% when the unit becomes participant-and-session.
  sitting_seated_file_frac: 0.50
  # Not seated, but this close to the cut. 56.3% of units hold one file and can
  # never disagree with themselves, so without this channel the majority rule
  # would claim perfect confidence on more than half the corpus.
  sitting_near_cut_knee_between_torso: 0.06

  # FM2, Round 5. The PI's position: a body part crossing the raster edge is
  # only a problem when it degrades the SMPL fit, and the fit has its own
  # released per-frame flag. So FM2 keeps files whose SMPL-H is valid on every
  # frame. The geometric in-frame measures are still computed and reported --
  # see reproj_* for a direct, independent measure of fit quality -- but they no
  # longer decide anything.
  smplh_valid_required_frac: 1.0
  in_frame_required_frac: 1.0
  in_frame_margin_px: 0.0
  min_violation_run_frames: 1

  # FM3 -- unchanged, the reviewer confirmed the calibration.
  static_frac_limit: 0.75
  static_radius_shoulder_widths: 0.10

outputs:
  # New root per round, so rounds stay comparable on disk.
  root: outputs/session2/v00_fm_briefing
  shards: shards
