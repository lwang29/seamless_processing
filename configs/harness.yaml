source_root: ./seamless_interaction
manifest: configs/dev_sample.csv

window:
  fps: 30
  duration_s: 4
  hop_s: 1

measurements:
  translation_scale_to_nominal_mm: 1000.0
  translation_basis: smplh_model_space_root_translation
  physical_units_verified: false
  wrist_basis: released_coco_wholebody_body_wrists_9_10_native_frame_pixels_per_frame
  # Session-2 small fix: widens each invalid run symmetrically before window
  # slicing, justified by the one-frame optimistic-valid edge in invalid_02.mp4.
  invalid_guard_band_frames: 3
  ffprobe_bin: ffprobe

outputs:
  root: outputs/harness
  per_file_dir: files
  completion_dir: complete
  error_dir: errors
