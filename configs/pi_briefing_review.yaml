schema_version: 1
session: 3
review_round: 15
variant: pi_briefing_all_vendors
purpose: >
  The corpus-wide briefing page: what the five checks are for, how each is
  implemented, what they did to a fresh sample of every vendor, and a stratified
  cross-section of the clips themselves.

  It collects nothing — no notes, no ratings, no inputs — because it is shown to
  someone being brought up to speed rather than asked for judgements. Every
  number on it is read from the scan of the sample it shows.

  Structure: four vendors as top-level sections, seven strata inside each — the
  two passing conditions and one per check that can reject. Strata that are empty
  by construction rather than by chance are named in the prose at the top.

source_root: ./seamless_interaction
metadata_root: ./datasets/seamless_interaction_metadata
model_root: ./model_files

sampling:
  seed: 20270421
  # Per vendor, per stratum. Seven strata x four vendors, minus the six that are
  # empty by construction.
  per_cell: 12

clip:
  duration_s: 30.0
  output_height_px: 480
  video_codec: libx264
  audio_codec: aac
  audio_muxed: true
  start_time_basis: measured_avg_frame_rate
  resample: false
  filmstrip_thumbnails: 10
  upright_side_view: true

smplh:
  model_type: smplh
  gender: neutral
  ext: npz
  use_pca: false
  num_betas: 16
  beta_convention: zeros
  flat_hand_mean: true

measurement:
  invalid_guard_band_frames: 3
  fps_source: measured_avg_frame_rate
  movement_validity_is_optional: true

outputs:
  manifest: ./configs/pi_briefing_manifest.csv
  report_dir: ./outputs/session3/pi_briefing_review
  private_root: ./artifacts/private_briefing_all_vendors
  directory_mode: "0700"
  media_mode: "0600"
  link_source_media: true
