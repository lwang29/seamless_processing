schema_version: 1
session: 2
purpose: >
  M-3 prototype signal characterization on the Session-1 dev manifest.
  Distributions only: no threshold, no gate, no selection.

source_root: ./seamless_interaction
manifest: configs/dev_sample.csv

span:
  # Five seconds at the release's own annotation step. Spans, not whole files,
  # so within-file spread stays visible.
  frames: 150
  # Evenly spaced across each file including its first and last usable span.
  per_file: 8

measurement:
  invalid_guard_band_frames: 3
  # Characterization parameter for the rest-pose-exit fraction, reported
  # alongside the threshold-free wrist-displacement percentiles.
  rest_exit_displacement_mm: 100.0
  ffprobe_bin: /usr/bin/ffprobe

smplh:
  model_root: ./model_files
  # Frozen by the M-4 acceptance comparison.
  flat_hand_mean: true
  batch_size: 256
  device: cuda

outputs:
  root: outputs/session2/m3_dev_features
