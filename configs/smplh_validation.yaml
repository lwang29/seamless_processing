version: 1

# This is a deliberately small acceptance sample from Session 1's dev
# manifest. Expansion is allowed only after the reprojection is structured and
# small on this set.
source_root: ./seamless_interaction
model_root: ./model_files
manifest: ./configs/smplh_validation_sample.csv
output_dir: ./outputs/session2/smplh_validation_tiny
sample_seed: 20260805
max_frames_per_file: 64
batch_size: 16
device: cpu

model:
  model_type: smplh
  gender: neutral
  ext: npz
  use_pca: false
  num_betas: 16
  beta_convention: all_zero_project_convention
  flat_hand_mean_candidates: [false, true]

# These are explicit HMR 2.0 camera-hypothesis choices, not intrinsics stored
# in the Seamless payload. The validation script tests them against released
# COCO-WholeBody keypoints.
camera_hypothesis:
  base_focal_length: 5000.0
  model_input_size: 256.0
  focal_scaling: base_focal_over_model_input_times_max_raster_dimension
  principal_point: raster_center

evaluation:
  body_released_indices: [0, 23]
  left_hand_released_indices: [91, 112]
  right_hand_released_indices: [112, 133]
  keypoint_score_threshold: null
  frame_requirements:
    - smplh:is_valid
    - boxes_and_keypoints:is_valid_box
    - finite_pose_translation_box_and_keypoints
