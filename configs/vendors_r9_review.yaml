schema_version: 1
session: 3
review_round: 9
variant: other_vendors_briefing
purpose: >
  Round 9. One correction and two confirmations. With 90 V03 posture labels
  instead of 58, hip flexion beats knee position badly, so FM1 on V03 now reads
  hip flexion at 146 degrees. Voice isolation was refuted as a detector by the
  Round-8 audio labels and stays a signal. The pillarbox crop, which Round 8
  implemented but never called, is now actually applied.

  Clips go through the repair layer: black columns cropped, pixel aspect applied,
  quarter turns undone, annotations indexed by timestamp. Each clip is fetched
  into memory and played from a blob, so scrubbing no longer depends on what the
  transport will serve.

source_root: ./seamless_interaction
metadata_root: ./datasets/seamless_interaction_metadata
model_root: ./model_files

sampling:
  seed: 20261211
  # Adjudication draws.
  posture_per_band: 8          # x 4 bands bracketing FM1's new 146-degree cut
  audio_per_vendor: 10         # x 3 vendors, drawn from survivors only
  per_odd_raster: 5
  per_ask: 6
  cropped_rasters: ["1080x960", "2180x3840"]
  # The stratified sample: per vendor, per outcome (pass, each flag alone, multi).
  per_vendor_per_cell: 9

clip:
  duration_s: 30.0
  output_height_px: 480
  video_codec: libx264
  audio_codec: aac
  audio_muxed: true
  start_time_basis: measured_avg_frame_rate
  resample: false
  filmstrip_thumbnails: 10
  upright_side_view: true

smplh:
  model_type: smplh
  gender: neutral
  ext: npz
  use_pca: false
  num_betas: 16
  beta_convention: zeros
  flat_hand_mean: true

measurement:
  invalid_guard_band_frames: 3
  fps_source: measured_avg_frame_rate
  movement_validity_is_optional: true

outputs:
  manifest: ./configs/vendors_r9_manifest.csv
  report_dir: ./outputs/session3/vendors_r9_review
  private_root: ./artifacts/private_review_vendors_r9
  directory_mode: "0700"
  media_mode: "0600"
  link_source_media: true
