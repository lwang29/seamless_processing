schema_version: 1
session: 3
review_round: 10
variant: other_vendors_briefing
purpose: >
  Round 10. A seated clip reached the reviewer having passed FM1, because its
  own file read seated and the other thirteen in its participant-session outvoted
  it. FM1's verdict scope is now per-vendor: session majority for V00-V02, the
  file's own reading for V03, where 16.2% of multi-file sessions are mixed. The
  asks are the files where the two scopes disagree, in both directions.

  Clips go through the repair layer: black columns cropped, pixel aspect applied,
  quarter turns undone, annotations indexed by timestamp. Each clip is fetched
  into memory and played from a blob, so scrubbing no longer depends on what the
  transport will serve.

source_root: ./seamless_interaction
metadata_root: ./datasets/seamless_interaction_metadata
model_root: ./model_files

sampling:
  seed: 20270105
  # Adjudication draws.
  posture_per_band: 10         # x 2 bands, only where standing files are lost
  scope_per_side: 14           # x 2 directions the scope change moves a file
  per_odd_raster: 5
  per_ask: 6
  cropped_rasters: ["1080x960", "2180x3840"]
  # The stratified sample: per vendor, per outcome (pass, each flag alone, multi).
  per_vendor_per_cell: 8

clip:
  duration_s: 30.0
  output_height_px: 480
  video_codec: libx264
  audio_codec: aac
  audio_muxed: true
  start_time_basis: measured_avg_frame_rate
  resample: false
  filmstrip_thumbnails: 10
  upright_side_view: true

smplh:
  model_type: smplh
  gender: neutral
  ext: npz
  use_pca: false
  num_betas: 16
  beta_convention: zeros
  flat_hand_mean: true

measurement:
  invalid_guard_band_frames: 3
  fps_source: measured_avg_frame_rate
  movement_validity_is_optional: true

outputs:
  manifest: ./configs/vendors_r10_manifest.csv
  report_dir: ./outputs/session3/vendors_r10_review
  private_root: ./artifacts/private_review_vendors_r10
  directory_mode: "0700"
  media_mode: "0600"
  link_source_media: true
