schema_version: 2
session: 2
review_round: 4
purpose: >
  Gallery for confirming the three V00 failure-mode detectors fire on what they
  claim to, after the Round-3 review rebuilt FM1 and FM2.
  Stratified by cohort (the same files the reviewer already inspected, versus
  fresh ones), then by pass/flag, failure mode, and label.

source_root: ./seamless_interaction
metadata_root: ./datasets/seamless_interaction_metadata
model_root: ./model_files

sampling:
  seed: 20260816
  # The Round-3 gallery's 202 files become the recheck cohort, so the detector
  # changes are judged on clips the reviewer has already formed an opinion about.
  # Read from the previous manifest rather than re-derived, so the cohort is
  # exactly the set they saw.
  previous_manifest: ./configs/v00_fm_review_round3_manifest.csv
  # Fresh cohort, per failure mode, per label. Singly-flagged files are preferred
  # so what the reviewer sees can be attributed to one detector, and files from
  # participants the recheck cohort already used are taken last.
  flagged_per_mode_per_label: 15
  # Files tripping two or more detectors, so overlap is visible too.
  multi_flag_per_label: 12
  # Random draw from files passing all three. Not a curated best-of: the pass
  # group has to stay an honest base rate.
  pass_per_label: 40
  # FM2 clips start this long before the longest violation run, so the reviewer
  # sees the participant leave frame rather than starting already outside it.
  fm2_anchor_lead_in_s: 5.0
  # Unlabelled standing controls mixed into the FM1 adjudication group, so the
  # reviewer's answers there can be scored rather than just collected.
  fm1_control_clips: 10
  # Units sitting just above the FM1 cut. 56% of units hold a single file and can
  # never disagree with themselves, so this is the only channel that surfaces
  # where the boundary actually is.
  fm1_near_cut_clips: 18

clip:
  # Round 4: 30 s, up from 10. Ten seconds was too short to judge whether a
  # gesture pattern holds.
  duration_s: 30.0
  output_height_px: 480
  video_codec: libx264
  audio_codec: aac
  audio_muxed: true
  start_time_basis: measured_avg_frame_rate
  resample: false
  # Panel A' (the upper-body crop) was retired in Round 4.
  # Ten, not twelve: at twelve the thumbnails were too small to read.
  filmstrip_thumbnails: 10

smplh:
  model_type: smplh
  gender: neutral
  ext: npz
  use_pca: false
  num_betas: 16
  beta_convention: zeros
  flat_hand_mean: true

measurement:
  invalid_guard_band_frames: 3
  fps_source: measured_avg_frame_rate
  movement_validity_is_optional: false

outputs:
  manifest: ./configs/v00_fm_review_manifest.csv
  report_dir: ./outputs/session2/v00_fm_review_r4
  private_root: ./artifacts/private_review_v00_fm_r5
  directory_mode: "0700"
  media_mode: "0600"
  link_source_media: true
