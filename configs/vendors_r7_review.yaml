schema_version: 1
session: 3
review_round: 7
variant: other_vendors_briefing
purpose: >
  Round 7. Briefing layout throughout, which is now the standard for every
  gallery: what the pipeline does and what it did to this sample at the top, a
  table of contents, hard rules between sections, the signals for each clip
  visible on the card, and no free-text notes.

  Two halves. The adjudication sections carry the questions Round-6 review left
  open and that only a person can settle -- above all where FM1's posture cut
  belongs on V03. The rest is a fresh random draw, disjoint from Round 6,
  stratified by vendor and by exactly which checks fired.

  Clips are rendered through the new repair layer: the container's pixel aspect
  is applied, quarter-turned rasters are stood upright, and annotations are
  indexed by timestamp rather than frame number.

source_root: ./seamless_interaction
metadata_root: ./datasets/seamless_interaction_metadata
model_root: ./model_files

sampling:
  seed: 20261006
  # Adjudication draws.
  posture_per_band: 6          # x 7 bands spanning FM1's cut
  per_odd_raster: 4
  per_ask: 6
  odd_rasters: ["1012x1920", "1920x1080", "640x480", "1080x960", "3840x2160", "2180x3840"]
  # The stratified sample: per vendor, per outcome (pass, each flag alone, multi).
  per_vendor_per_cell: 13

clip:
  duration_s: 30.0
  output_height_px: 480
  video_codec: libx264
  audio_codec: aac
  audio_muxed: true
  start_time_basis: measured_avg_frame_rate
  resample: false
  filmstrip_thumbnails: 10
  upright_side_view: true

smplh:
  model_type: smplh
  gender: neutral
  ext: npz
  use_pca: false
  num_betas: 16
  beta_convention: zeros
  flat_hand_mean: true

measurement:
  invalid_guard_band_frames: 3
  fps_source: measured_avg_frame_rate
  movement_validity_is_optional: true

outputs:
  manifest: ./configs/vendors_r7_manifest.csv
  report_dir: ./outputs/session3/vendors_r7_review
  private_root: ./artifacts/private_review_vendors_r7
  directory_mode: "0700"
  media_mode: "0600"
  link_source_media: true
