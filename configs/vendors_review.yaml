schema_version: 1
session: 2
review_round: 6
variant: other_vendors
purpose: >
  Exploratory gallery over V01, V02 and V03 — the vendors the detectors were not
  built on. Stratified by vendor and by what the current V00-tuned pipeline says,
  so both ends of the distribution are visible. Free-text notes are on: this is a
  Pass-1 exploratory review looking for failure modes we have not named yet, so
  it deliberately offers no categories.

source_root: ./seamless_interaction
metadata_root: ./datasets/seamless_interaction_metadata
model_root: ./model_files

sampling:
  seed: 20260922
  # Per vendor, per verdict. Six cells.
  per_vendor_per_verdict: 55

clip:
  duration_s: 30.0
  output_height_px: 480
  video_codec: libx264
  audio_codec: aac
  audio_muxed: true
  start_time_basis: measured_avg_frame_rate
  resample: false
  filmstrip_thumbnails: 10
  upright_side_view: true

smplh:
  model_type: smplh
  gender: neutral
  ext: npz
  use_pca: false
  num_betas: 16
  beta_convention: zeros
  flat_hand_mean: true

measurement:
  invalid_guard_band_frames: 3
  fps_source: measured_avg_frame_rate
  movement_validity_is_optional: true

outputs:
  manifest: ./configs/vendors_review_manifest.csv
  report_dir: ./outputs/session2/vendors_review
  private_root: ./artifacts/private_review_vendors
  directory_mode: "0700"
  media_mode: "0600"
  link_source_media: true
